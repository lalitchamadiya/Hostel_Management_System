{% load static %}
<!-- ==============================================================================
     Centralized Theme & Styling System Design Tokens
     Dynamically injected from SystemSettings (Database-driven)
     Controls theme hex color, hover shades, RGB tokens, and enforce dark/light mode
     ============================================================================== -->
<style id="dynamic-theme-tokens">
  :root {
    --primary: {{ system_settings.theme_color|default:'#6366f1' }};
    --primary-rgb: {{ system_settings.theme_color_rgb|default:'99, 102, 241' }};
    --primary-hover: {{ system_settings.theme_color_hover|default:'#4f46e5' }};
    --primary-glow: rgba(var(--primary-rgb), 0.35);
    --primary-subtle: rgba(var(--primary-rgb), 0.12);
    --mesh-color-1: rgba(var(--primary-rgb), 0.16);
    --bs-primary: var(--primary);
    --bs-primary-rgb: var(--primary-rgb);
    --bs-link-color: var(--primary);
    --bs-link-hover-color: var(--primary-hover);
    --bs-focus-ring-color: var(--primary-glow);
  }

  html[data-theme="dark"] {
    --primary: {{ system_settings.theme_color|default:'#6366f1' }};
    --primary-rgb: {{ system_settings.theme_color_rgb|default:'99, 102, 241' }};
    --primary-hover: {{ system_settings.theme_color_hover|default:'#4f46e5' }};
    --primary-glow: rgba(var(--primary-rgb), 0.45);
    --primary-subtle: rgba(var(--primary-rgb), 0.18);
    --mesh-color-1: rgba(var(--primary-rgb), 0.20);
    --bs-primary: var(--primary);
    --bs-primary-rgb: var(--primary-rgb);
    --bs-link-color: var(--primary);
    --bs-link-hover-color: var(--primary-hover);
    --bs-focus-ring-color: var(--primary-glow);
  }

  html[data-theme="light"] {
    --primary: {{ system_settings.theme_color|default:'#6366f1' }};
    --primary-rgb: {{ system_settings.theme_color_rgb|default:'99, 102, 241' }};
    --primary-hover: {{ system_settings.theme_color_hover|default:'#4f46e5' }};
    --primary-glow: rgba(var(--primary-rgb), 0.25);
    --primary-subtle: rgba(var(--primary-rgb), 0.08);
    --mesh-color-1: rgba(var(--primary-rgb), 0.12);
    --bs-primary: var(--primary);
    --bs-primary-rgb: var(--primary-rgb);
    --bs-link-color: var(--primary);
    --bs-link-hover-color: var(--primary-hover);
    --bs-focus-ring-color: var(--primary-glow);
  }

  /* Global Component Styling Overrides mapped to Dynamic Theme Tokens */
  .btn-primary, .theme-primary-grad {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%) !important;
    border-color: var(--primary) !important;
    color: #ffffff !important;
    box-shadow: 0 4px 12px -2px var(--primary-glow) !important;
  }
  .btn-primary:hover, .btn-primary:focus, .theme-primary-grad:hover, .theme-primary-grad:focus {
    background: linear-gradient(135deg, var(--primary-hover) 0%, var(--primary) 100%) !important;
    border-color: var(--primary-hover) !important;
    color: #ffffff !important;
    box-shadow: 0 8px 18px -2px var(--primary-glow) !important;
    transform: translateY(-2px);
  }
  .btn-primary:active, .theme-primary-grad:active {
    transform: translateY(1px);
  }

  .btn-outline-primary {
    border-color: var(--primary) !important;
    color: var(--primary) !important;
  }
  .btn-outline-primary:hover, .btn-outline-primary:focus, .btn-outline-primary:active {
    background-color: var(--primary) !important;
    border-color: var(--primary) !important;
    color: #ffffff !important;
    box-shadow: 0 6px 14px -2px var(--primary-glow) !important;
  }

  .text-primary {
    color: var(--primary) !important;
  }
  .bg-primary {
    background-color: var(--primary) !important;
    color: #ffffff !important;
  }
  .border-primary {
    border-color: var(--primary) !important;
  }

  .bg-gradient-primary {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%) !important;
    box-shadow: 0 4px 12px var(--primary-glow) !important;
  }

  .badge.bg-primary {
    background-color: var(--primary) !important;
    color: #ffffff !important;
  }
  .badge.bg-primary.bg-opacity-10, .badge.bg-primary.bg-opacity-20 {
    background-color: var(--primary-subtle) !important;
    color: var(--primary) !important;
  }

  .form-control:focus, .form-select:focus {
    border-color: var(--primary) !important;
    box-shadow: 0 0 0 3.5px var(--primary-glow), inset 0 1px 2px rgba(0,0,0,0.02) !important;
    outline: none !important;
  }

  .form-check-input:checked {
    background-color: var(--primary) !important;
    border-color: var(--primary) !important;
  }

  .nav-pills .nav-link.active {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%) !important;
    color: #ffffff !important;
    box-shadow: 0 4px 10px -2px var(--primary-glow) !important;
  }

  .nav-tabs .nav-link.active {
    border-bottom-color: var(--primary) !important;
    color: var(--primary) !important;
  }

  .page-item.active .page-link {
    background-color: var(--primary) !important;
    border-color: var(--primary) !important;
    color: #ffffff !important;
  }

  /* Sidebar Active & Hover Dynamic Theming */
  .sidebar-pro .nav-link:hover {
    color: var(--primary) !important;
  }
  .sidebar-pro .nav-link:hover .sidebar-label,
  .sidebar-pro .nav-link:hover .bi,
  .sidebar-pro .nav-link:hover .material-symbols-outlined {
    color: var(--primary) !important;
  }

  html[data-theme="dark"] .sidebar-pro .nav-link.active {
    color: #ffffff !important;
    background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.22) 0%, rgba(var(--primary-rgb), 0.38) 100%) !important;
    border: 1px solid rgba(var(--primary-rgb), 0.38) !important;
    box-shadow: 0 0 14px var(--primary-glow), inset 0 1px 0 rgba(255, 255, 255, 0.15) !important;
  }
  html[data-theme="light"] .sidebar-pro .nav-link.active {
    color: var(--primary-hover) !important;
    background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.08) 0%, rgba(var(--primary-rgb), 0.16) 100%) !important;
    border: 1px solid rgba(var(--primary-rgb), 0.28) !important;
    box-shadow: 0 2px 8px rgba(var(--primary-rgb), 0.12) !important;
  }

  .sidebar-pro .nav-link.active::before {
    background: var(--primary) !important;
  }
  html[data-theme="dark"] .sidebar-pro .nav-link.active::before {
    background: var(--primary) !important;
  }
</style>

<!-- Anti-Flash Instant Theme Execution (Runs synchronously in <head>) -->
<script>
  (function() {
    var serverEnforceDark = {{ system_settings.dark_mode_default|yesno:"true,false" }};
    var serverDefault = serverEnforceDark ? 'dark' : 'light';
    var serverThemeColor = "{{ system_settings.theme_color|default:'#6366f1' }}";
    var serverThemeRgb = "{{ system_settings.theme_color_rgb|default:'99, 102, 241' }}";
    var serverThemeHover = "{{ system_settings.theme_color_hover|default:'#4f46e5' }}";

    window.HMS_SERVER_DEFAULT_THEME = serverDefault;
    window.HMS_SERVER_THEME_COLOR = serverThemeColor;
    window.HMS_SERVER_THEME_RGB = serverThemeRgb;
    window.HMS_SERVER_THEME_HOVER = serverThemeHover;

    var storedTheme = localStorage.getItem('hms_theme');
    var activeTheme = storedTheme ? storedTheme : serverDefault;
    if (activeTheme === 'system') {
      activeTheme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', activeTheme);
  })();
</script>
